# ===============================
# Application Name
# ===============================
spring.application.name=VehicleRentalManagement

# ===============================
# Database Configuration (Local MySQL)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/vehiclerental?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# ===============================
# Thymeleaf Configuration
# ===============================
spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=false

# ===============================
# Server Configuration
# ===============================
server.port=8082

# ===============================
# Connection Pool (HikariCP)
# ===============================
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000

# ===============================
# Logging (Optional, for debugging)
# ===============================
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ===============================
# JWT Configuration
# ===============================
# ✅ Updated secret: 64 characters (~512 bits, safe for HS256)
jwt.secret=MyUltraSecureJWTSecretKey1234567890_ExtraStrongKey9876543210
jwt.expiration=3600000
